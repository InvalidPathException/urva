[workspace]
resolver = "3"
members = ["urva", "urva-derive"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mongodb = "3.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = "0.3"
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tokio = { version = "1", features = ["full"] }
trybuild = "1"
urva-derive = { path = "urva-derive" }
